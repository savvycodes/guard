name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 10

            - name: Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run linter
              run: pnpm check:strict

            - name: Build packages
              run: pnpm build

            - name: Run tests
              run: pnpm test

            # guard-react supports React 18 and 19; the workspace develops against 19.
            - name: Run React 18 tests
              run: |
                  pnpm --filter @savvycodes/guard-react add -D react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18
                  pnpm --filter @savvycodes/guard-react typecheck
                  pnpm --filter @savvycodes/guard-react test
